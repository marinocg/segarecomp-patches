space = "m68k.work_ram"
offset = 63249
length = 1
access = "read"

# split-screen flag: read at frame-end for the HUD continuity records.
[[memory]]
revision = "jue-rev01"
space = "m68k.work_ram"
offset = 65496
length = 2
access = "read"

# HUD flash phase: read at frame-end for the HUD continuity records.
[[memory]]
revision = "jue-rev01"
space = "m68k.work_ram"
offset = 65029
length = 1
access = "read"

# ring count: read at frame-end for the HUD continuity records.
[[memory]]
revision = "jue-rev01"
