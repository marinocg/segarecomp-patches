[build]
header_repair = "none"

# game mode: read at frame-end for the HUD continuity records.
[[memory]]
revision = "jue-rev01"
space = "m68k.work_ram"
offset = 62976
length = 1
access = "read"

# level-started flag: read at frame-end for the HUD continuity records.
[[memory]]
