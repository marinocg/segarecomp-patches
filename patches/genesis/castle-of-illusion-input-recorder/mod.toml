# Castle of Illusion starring Mickey Mouse (Genesis, USA/Europe): INPUT RECORDER (a developer tool, not a game change). It only READS the controller once per guest frame and logs every change; it writes nothing to the game, adds no ROM edit and no guest code.
# Unpublished source project: no release.json, no catalog entry. Native code is host code: the user approves the exact package identity.
[mod]
id = "castle-of-illusion-input-recorder"
author = "segarecomp-patches contributors"
version = "0.1.0"
name = "Castle of Illusion input recorder"
license = "MIT"

[target]
platform = "genesis"

[[target.revision]]
label = "usa-europe"
sha256 = "2d535ff7eda650a64a9093ba6fabf8d5ac87801b898a76b591db41a1c8e47c4f"

[[source]]
kind = "native-c11"
path = "src/provider.c"

[abi]
native = 2

[capabilities]
required = ["host.log", "input.read"]
