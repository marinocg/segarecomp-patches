# Castle of Illusion starring Mickey Mouse (Genesis, USA/Europe): authored widescreen scenery and Practice+ (a user-invoked power restore) as ONE schema 3 / native ABI 2 package.
# Unpublished source project: no release.json, no catalog entry. Native code is host code: the user approves the exact package identity.
[mod]
id = "castle-of-illusion-widescreen-practice"
author = "segarecomp-patches contributors"
version = "0.1.0"
name = "Castle of Illusion widescreen + Practice+"
license = "MIT"

[target]
platform = "genesis"

[[target.revision]]
label = "usa-europe"
sha256 = "2d535ff7eda650a64a9093ba6fabf8d5ac87801b898a76b591db41a1c8e47c4f"

[[source]]
kind = "native-c11"
path = "src/provider.c"

[abi]
native = 2

[capabilities]
required = ["frame.work_ram", "hook.function", "input.intercept", "input.read", "memory.read.m68k.work_ram", "memory.write.m68k.work_ram", "overlay.rgba", "scenery.words", "state.mod"]

[state]
schema = 1

# The block-expansion tables of both planes (A at 0x0000, B at 0x0800; each holds up to 256 blocks of 8 bytes).
[[memory]]
revision = "usa-europe"
space = "m68k.work_ram"
offset = 0
length = 4096
access = "read"

# Plane A's block map (from 0x2000, up to 0x4800).
[[memory]]
revision = "usa-europe"
space = "m68k.work_ram"
offset = 8192
length = 10240
access = "read"

# Plane B's block map (at 0x4800 or 0x5000, up to 0x7000).
[[memory]]
revision = "usa-europe"
space = "m68k.work_ram"
offset = 18432
length = 10240
access = "read"

# Practice+: the five HUD slot words (0xF244..0xF24D), the only guest memory besides power and the HUD flag byte the package writes.
[[memory]]
revision = "usa-europe"
space = "m68k.work_ram"
offset = 62020
length = 10
access = "read-write"

# Practice+: Mickey's power word (0xF322).
[[memory]]
revision = "usa-europe"
space = "m68k.work_ram"
offset = 62242
length = 2
access = "read-write"

# Practice+: the HUD-upload flag byte (0xF409; bit 0 asks the game to upload the HUD row again).
[[memory]]
revision = "usa-europe"
space = "m68k.work_ram"
offset = 62473
length = 1
access = "read-write"

# Actors: the object structures (one flag byte each) and the sprite buffer the object sprite builder fills (0xF500..0xF7FF).
[[memory]]
revision = "usa-europe"
space = "m68k.work_ram"
offset = 40960
length = 22528
access = "read"

# The scroll records of both planes (0xFA80 and 0xFAC0).
[[memory]]
revision = "usa-europe"
space = "m68k.work_ram"
offset = 64128
length = 96
access = "read"

[[symbol]]
name = "object_sprite_pieces"
revision = "usa-europe"
address = "0x1ab6"
provenance = "verified"

[[symbol]]
name = "sprite_piece_x_clip"
revision = "usa-europe"
address = "0x1c34"
provenance = "verified"

# A `before` hook only observes: it never changes the guest. The anchor names the object sprite builder (a verified symbol the program executes) so the build can prove the call sites of the clip routine.
[[hook]]
id = "sprite-piece-x-clip"
symbol = "sprite_piece_x_clip"
anchor = "object_sprite_pieces"
mode = "before"
reads = ["d0", "a0", "a2"]

[geometry]
aspect_max = "32:9"

