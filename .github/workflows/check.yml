name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repository checks (no commercial data)
        run: |
          python3 scripts/check_repo.py
          python3 scripts/build_catalog.py --check
          python3 -m unittest -q tests.test_check_repo
