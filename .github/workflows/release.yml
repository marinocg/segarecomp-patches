name: release
# Rebuilds the packages of ONE prepared collection release from committed sources and creates a DRAFT GitHub release. Publication stays a manual maintainer
# action. Lifecycle (docs/releases.md): prepare metadata in a PR -> run this workflow from main -> maintainer publishes the draft -> record it with
# scripts/prepare_release.py publish in a follow-up PR. A published release is never recreated or altered (scripts/release_guard.py).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Prepared release tag (metadata in patches/*/*/release.json, notes in docs/release-notes/<tag>.md)
        required: true
      dry_run:
        description: Rebuild and verify only; do not create the draft
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lifecycle guard (new release / draft / published / deleted / superseding version)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$TAG" --json tagName,isDraft > "$RUNNER_TEMP/release-state.json" 2>/dev/null; then STATE="$RUNNER_TEMP/release-state.json"; else STATE=none; fi
          python3 scripts/release_guard.py --tag "$TAG" --release-state "$STATE"
      - name: Repository checks
        run: |
          python3 scripts/check_repo.py
          python3 scripts/build_catalog.py --check
          python3 scripts/validate_catalog.py
          python3 scripts/verify_provenance.py
          python3 scripts/check_source_review.py
          python3 -m unittest -q tests.test_check_repo tests.test_validate_catalog tests.test_release_pipeline tests.test_release_lifecycle
      - name: Rebuild this release from source with its recorded writer and verify it against its metadata
        env:
          TAG: ${{ inputs.tag }}
        run: python3 scripts/rebuild_release.py --release "$TAG" --work "$RUNNER_TEMP/rebuild"
      - name: Create draft release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          test -f "docs/release-notes/${TAG}.md"
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "segarecomp Patches ${TAG}" \
            --notes-file "docs/release-notes/${TAG}.md" "$RUNNER_TEMP/rebuild/$TAG"/*.segapatch "$RUNNER_TEMP/rebuild/$TAG/SHA256SUMS"
