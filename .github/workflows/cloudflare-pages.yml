name: cloudflare-pages
# Builds the site, validates every referenced package digest against the catalog and the published release assets, and deploys to Cloudflare Pages.
#   release published / manual dispatch  -> production deployment (environment `cloudflare-production`)
#   pull request from this repository     -> preview deployment   (environment `cloudflare-preview`)
#   pull request from a fork              -> build and validation only; no secret is ever available to it
# One-time human setup (Cloudflare project, API token, repository variables/secrets): docs/cloudflare-pages.md.
# The GitHub Pages workflow (pages.yml) stays in place until the production URL below is confirmed and recorded.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose assets are verified before deployment
        required: true
        default: v0.1.0
  pull_request:
permissions:
  contents: read          # the workflow-level token never writes; deployment uses only the scoped Cloudflare token of the deploy jobs
concurrency:
  group: cloudflare-pages-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  SITE_URL: ${{ vars.CF_SITE_URL || 'https://segarecomp-patches.pages.dev' }}
  SITE_BASE: ""
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Repository, catalog and provenance checks
        run: |
          python3 scripts/check_repo.py
          python3 scripts/build_catalog.py --check
          python3 scripts/validate_catalog.py
          python3 scripts/verify_provenance.py
          python3 scripts/check_source_review.py
      - name: Fetch the pinned package writer
        run: curl -fsSL "https://raw.githubusercontent.com/marinocg/segarecomp/$(cat scripts/SEGAPATCH_REF)/tools/segapatch.py" -o "$RUNNER_TEMP/segapatch.py"
      - name: Rebuild every package from source (must equal the catalog digests)
        run: |
          python3 scripts/build_packages.py --segapatch "$RUNNER_TEMP/segapatch.py" --out "$RUNNER_TEMP/rebuilt"
          python3 scripts/check_repo.py --assets "$RUNNER_TEMP/rebuilt"
      - name: Published release assets must equal the catalog digests (release and dispatch only)
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/published"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/published"
          python3 scripts/check_repo.py --assets "$RUNNER_TEMP/published"
      - name: Build the static site
        working-directory: site
        run: npm ci && npm run build
      - name: Link, accessibility and search checks on exactly what will be deployed
        run: |
          python3 scripts/check_site_links.py site/dist
          python3 scripts/check_site_a11y.py site/dist
          (cd site && npm run test:search)
          python3 scripts/artifact_budget.py --site-files "$(find site/dist -type f | wc -l)"
      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: site/dist
          retention-days: 7
  # Deploy jobs: the only jobs that see a secret. Environments hold the token; a fork's pull request never reaches them.
  preview:
    needs: build
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    environment: cloudflare-preview
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist
      - name: Deploy the preview (branch alias pr-N)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CF_PAGES_PROJECT || 'segarecomp-patches' }}
          BRANCH: pr-${{ github.event.pull_request.number }}
        run: npx --yes wrangler@4 pages deploy dist --project-name "$PROJECT" --branch "$BRANCH" --commit-hash "$GITHUB_SHA" --commit-dirty=true
  production:
    needs: build
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-production
      url: ${{ env.SITE_URL }}
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist
      - name: Deploy to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CF_PAGES_PROJECT || 'segarecomp-patches' }}
        run: npx --yes wrangler@4 pages deploy dist --project-name "$PROJECT" --branch main --commit-hash "$GITHUB_SHA"
