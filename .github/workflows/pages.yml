name: pages
# Publishes the documentation and catalog site to GitHub Pages (https://marinocg.github.io/segarecomp-patches/).
#   push to main / manual dispatch -> deploy
#   release published              -> verify the published assets against the catalog digests, rebuild, deploy
# Pull requests only build and check the site (site.yml); GitHub Pages has no per-PR previews and no secret is involved anywhere.
# One-time repository setting: Settings -> Pages -> Source = "GitHub Actions" (recorded in docs/repository-settings.md).
on:
  push:
    branches: [main]
    paths: ['site/**', 'catalog/**', 'docs/product-docs.pin.json', '.github/workflows/pages.yml']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose assets are verified before deployment (optional)
        required: false
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A release event's own ref is the tag, whose tree predates the site (v0.1.0). The site and catalog always come from the default
          # branch (or the dispatched/pushed ref); the tag only selects which published assets are verified.
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Catalog, provenance and source-review checks
        run: |
          python3 scripts/validate_catalog.py
          python3 scripts/verify_provenance.py
          python3 scripts/check_source_review.py
      - name: Published release assets must equal the catalog digests (a wrong digest stops the deployment)
        if: ${{ github.event_name == 'release' || inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/published"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/published"
          python3 scripts/check_repo.py --assets "$RUNNER_TEMP/published" --release "$TAG"
      - working-directory: site
        run: npm ci && npm run build
      - name: Link check and search test on exactly what will be published
        run: |
          python3 scripts/check_site_links.py site/dist
          python3 scripts/check_site_a11y.py site/dist
          python3 scripts/check_site_seo.py site/dist
          (cd site && npm run test:search)
          python3 scripts/artifact_budget.py --site-files "$(find site/dist -type f | wc -l)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
